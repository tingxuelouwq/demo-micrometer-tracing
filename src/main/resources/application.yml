server:
  port: 8090

spring:
  application:
    name: demo-micrometer-tracing
  cloud:
    # ==================== Consul 服务注册与发现 ====================
    consul:
      host: localhost
      port: 8500
      token: 5c72f559-9ef9-48b4-99c7-23e9092f9a0f
      discovery:
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}_${spring.cloud.client.ip-address}_${server.port}
        health-check-interval: 10s
        prefer-ip-address: true
        query-passing: true
  # ==================== 原生声明式 HTTP 客户端配置 ====================
  http:
    clients:
      # 全局：较宽松，给连接池留有余地
      connect-timeout: 3s
      read-timeout: 10s
    serviceclient:
      user-client:
        base-url: "lb://demo-micrometer-tracing"
        # 服务级：可以比全局更严格
        connect-timeout: 2s
        read-timeout: 5s
      echo-client:
        base-url: "lb://demo-micrometer-tracing"
        # 服务级：可以比全局更严格
        connect-timeout: 2s
        read-timeout: 5s

# ==================== Resilience4j 熔断限流配置 ====================
