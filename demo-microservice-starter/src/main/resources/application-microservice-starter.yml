spring:
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        acl-token: ${CONSUL_TOKEN:5c72f559-9ef9-48b4-99c7-23e9092f9a0f}
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}_${spring.cloud.client.ip-address}_${server.port}
        health-check-interval: 10s
        prefer-ip-address: true
        query-passing: true
    loadbalancer:
      retry:
        enabled: true
      cache:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_SERVER:localhost:9411}/api/v2/spans

# 链路追踪kafka配置
tracing:
  kafka:
    bootstrap-servers: ${TRACING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: ${TRACING_KAFKA_TOPIC:zipkin}
  # 过滤指定端点的链路追踪，避免产生大量无意义的span
  filter:
    exclude-paths:
      - /actuator
      - /health
      - /readyz
      - /livez
# 业务日志kafka配置
logging:
  kafka:
    bootstrap-servers: ${LOGGING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${LOGGING_KAFKA_TOPIC:app-logs}
