version: '3.8'

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"  # 宿主机访问用
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 关键：配置两个监听器，分别用于 Docker 内部和宿主机访问
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - microservices-network

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      # 使用 Kafka 容器名连接（Docker 内部 DNS）
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms128M -Xmx256M"
    depends_on:
      - kafka
    networks:
      - microservices-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - microservices-network

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    hostname: consul
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    environment:
      CONSUL_HTTP_TOKEN: 5c72f559-9ef9-48b4-99c7-23e9092f9a0f
    command: >
      consul agent -server -ui 
      -bootstrap 
      -client=0.0.0.0 
      -bind='{{ GetInterfaceIP "eth0" }}' 
      -data-dir=/consul/data
      -enable-script-checks=false
      -disable-host-node-id
      -hcl='acl { enabled = true default_policy = "deny" enable_token_persistence = true tokens { master = "5c72f559-9ef9-48b4-99c7-23e9092f9a0f" default = "5c72f559-9ef9-48b4-99c7-23e9092f9a0f" } }'
      -hcl='performance { raft_multiplier = 1 }'
    volumes:
      - consul-data:/consul/data
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "consul info -token=5c72f559-9ef9-48b4-99c7-23e9092f9a0f &>/dev/null && echo 0 || echo 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  microservices-network:
    driver: bridge

volumes:
  consul-data:
  kafka-data: